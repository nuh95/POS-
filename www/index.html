<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E7C5A"><title>Kasir Toko</title><style>

.bt{display:flex;gap:8px;margin:12px 0}.bt button{flex:1;min-height:48px}.g3{display:flex;gap:8px}.g3 .c{flex:1;margin:0 0 10px}
.sg{display:flex;gap:6px;margin:10px 0}.sg button{flex:1;background:#fff;color:var(--g);border:1px solid var(--g);font-size:13px;padding:0 4px}.sg .on{background:var(--g);color:#fff}
.nv{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde5e1;display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}.nv button{flex:1;min-height:56px;border:0;border-radius:0;background:none;color:var(--m);font-size:11px;font-weight:400;padding:0}.nv .on{color:var(--g);font-weight:700}
.fab{position:fixed;right:max(16px,calc((100vw - 640px)/2 + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 4px 12px #0005}

.bar{display:flex;gap:3px;align-items:flex-end;height:110px;margin-top:10px}.bar i{flex:1;background:var(--g);border-radius:3px 3px 0 0;min-height:2px}
#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:24px;display:none;z-index:9;max-width:90%;text-align:center}
@media print{body *{visibility:hidden}#st,#st *{visibility:visible}#st{position:absolute;left:0;top:0;width:100%}}
</style></head><body><div id="app"></div><div id="ts"></div><script>
var $=i=>document.getElementById(i),rp=n=>'Rp '+(+n||0).toLocaleString('id-ID'),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
var db=JSON.parse(localStorage.getItem('pos1')||'null')||{u:[],b:[],po:[],tx:[],m:[],o:[],n:0},ME=null,V='kasir',S={},C={it:[],mode:'e',dis:0},VW={},ROLE={pemilik:['kasir','barang','po','member','pesanan','laporan','akun'],gudang:['barang','po','akun'],kasir:['kasir','barang','member','pesanan','akun']};
var save=()=>localStorage.setItem('pos1',JSON.stringify(db)),ymd=t=>{var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},sod=t=>{var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
var hd=(t,s)=>`<div class="hd">${esc(t)}${s?'<small>'+esc(s)+'</small>':''}</div>`,rw=(a,b,st)=>`<div class="r" style="${st||''}"><span>${a}</span><b>${b}</b></div>`,item=id=>db.b.find(x=>x.id===id),canE=()=>ME.role!=='kasir',nm=id=>esc((item(id)||{nama:'(dihapus)'}).nama);
var sgm=(L,cur,fn)=>'<div class="sg">'+L.map(x=>`<button class="${cur===x[0]?'on':''}" onclick="${fn}('${x[0]}')">${x[1]}</button>`).join('')+'</div>';
function toast(m){var t=$('ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2500)}
async function hp(u,p){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pos|'+u.toLowerCase()+'|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function dl(f,t,m){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=f;a.click()}
function render(){var a=$('app');if(!ME){a.innerHTML=hd('Masuk','Kasir Toko')+`<div class="w"><div class="c"><label>Nama pengguna</label><input id="lu" autocapitalize="none"><label>Kata sandi</label><input id="lp" type="password"><div class="bt"><button onclick="doLogin()">Masuk</button></div><div class="mu">Akun awal: pemilik / admin123. Segera ganti sandi di menu Akun.</div></div></div>`;return}
var m={bayar:'kasir',struk:'kasir',fb:'barang',fpo:'po',tpo:'po',fm:'member',fo:'kasir',dos:'pesanan'}[V]||V,T=[['kasir','Kasir'],['barang','Barang'],['po','PO'],['member','Member'],['pesanan','Pesanan'],['laporan','Laporan'],['akun','Akun']].filter(x=>ROLE[ME.role].includes(x[0]));if(!ROLE[ME.role].includes(m)){V=m=ROLE[ME.role][0]}
a.innerHTML=VW[V]()+'<div class="nv">'+T.map(x=>`<button class="${x[0]===m?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+'</div>'}
function go(v,p){V=v;S.p=p;render();scrollTo(0,0)}
async function doLogin(){var u=$('lu').value.trim().toLowerCase(),h=await hp(u,$('lp').value),x=db.u.find(y=>y.un===u&&y.pw===h);if(!x)return toast('Nama pengguna atau sandi salah');ME=x;V=ROLE[x.role][0];render()}
/* KASIR */
var mem=id=>db.m.find(x=>x.id===id),tier=m=>m.tot>=5e6?'Gold':'Silver',price=b=>C.mode==='g'&&+b.grosir>0?+b.grosir:+b.eceran,sub=()=>C.it.reduce((s,x)=>s+price(item(x.b))*x.q,0),ptv=()=>C.m&&mem(C.m)?Math.min(C.pt||0,mem(C.m).poin,Math.floor(Math.max(0,sub()-C.dis)/100)):0,tot=()=>Math.max(0,sub()-C.dis-ptv()*100);
function qr(){var q=(S.q||'').trim().toLowerCase();if(!q)return'';return db.b.filter(b=>(b.kode+' '+b.nama).toLowerCase().includes(q)).slice(0,5).map(b=>`<button class="o" style="width:100%;margin-top:6px;text-align:left" onclick="add('${b.id}')">${esc(b.nama)} · ${rp(price(b))} · stok ${b.stok}</button>`).join('')||'<div class="mu">Barang tidak ditemukan</div>'}
function fq(){$('qr').innerHTML=qr()}
function addQ(){var q=(S.q||'').trim().toLowerCase(),b=db.b.find(x=>x.kode&&x.kode.toLowerCase()===q)||db.b.filter(x=>x.nama.toLowerCase().includes(q))[0];if(b)add(b.id)}
function add(id){var b=item(id),x=C.it.find(y=>y.b===id);if((x?x.q:0)+1>b.stok)return toast('Stok tidak cukup');x?x.q++:C.it.push({b:id,q:1});S.q='';render();$('q').focus()}
function chg(id,d){var b=item(id),x=C.it.find(y=>y.b===id);x.q+=d;if(x.q>b.stok){x.q=b.stok;toast('Stok tidak cukup')}if(x.q<=0)C.it=C.it.filter(y=>y!==x);render()}
var setMode=m=>{C.mode=m;render()};
VW.kasir=()=>{var s=sub();return hd('Kasir',ME.nama)+`<div class="w"><label>Scan barcode / cari barang</label><input id="q" value="${esc(S.q||'')}" oninput="S.q=this.value;fq()" onkeydown="if(event.key==='Enter')addQ()"><div id="qr">${qr()}</div>`+sgm([['e','Eceran'],['g','Grosir']],C.mode,'setMode')+(C.it.map(x=>{var b=item(x.b);return`<div class="c">${rw(esc(b.nama),rp(price(b)*x.q))}<div class="r" style="margin-top:8px"><span class="mu">${x.q} × ${rp(price(b))}</span><span><button class="o" aria-label="Kurangi" onclick="chg('${b.id}',-1)">−</button> <button aria-label="Tambah" onclick="chg('${b.id}',1)">+</button></span></div></div>`}).join('')||'<div class="c mu">Keranjang kosong. Scan atau cari barang.</div>')+`<div class="c">${rw('Subtotal',rp(s))}<label>Diskon (Rp)</label><input type="number" value="${C.dis||''}" onchange="C.dis=Math.min(+this.value||0,${s});render()">${memBox()}${rw('Total',rp(tot()),'font-size:18px;margin-top:10px')}</div><div class="bt"><button class="o" onclick="C={it:[],mode:C.mode,dis:0};render()">Kosongkan</button><button class="o" onclick="toOrder()">Jadikan Pesanan</button><button onclick="toBayar()">Bayar</button></div></div>`};
function memBox(){var m=C.m&&mem(C.m);return`<label>Member</label><select onchange="C.m=this.value;C.pt=0;render()"><option value="">Bukan member</option>${db.m.map(x=>`<option value="${x.id}"${x.id===C.m?' selected':''}>${esc(x.nama)} · ${esc(x.hp)}</option>`).join('')}</select>`+(m?`<div class="mu" style="margin-top:6px">${tier(m)} · ${m.poin} poin (1 poin = Rp 100)</div><label>Tukar poin</label><input type="number" value="${C.pt||''}" onchange="C.pt=Math.max(0,Math.floor(+this.value||0));render()">`+(ptv()?rw('Potongan poin','−'+rp(ptv()*100),'margin-top:6px'):''):'')}
function toBayar(){if(!C.it.length)return toast('Keranjang kosong');S.m='Tunai';S.paid=0;go('bayar')}
var setM=m=>{S.m=m;render()},kb=()=>$('kb').textContent=rp(Math.max(0,(S.paid||0)-tot()));
VW.bayar=()=>{var t=tot();return hd('Pembayaran')+`<div class="w"><div class="c"><span class="mu">Total belanja</span><div style="font-size:28px;font-weight:700">${rp(t)}</div></div>`+sgm([['Tunai','Tunai'],['QRIS','QRIS'],['Transfer','Transfer']],S.m,'setM')+(S.m==='Tunai'?`<label>Uang diterima</label><input id="pd" type="number" value="${S.paid||''}" oninput="S.paid=+this.value;kb()"><div class="bt">${[[t,'Uang pas'],[50000,'50.000'],[100000,'100.000']].map(x=>`<button class="o" onclick="S.paid=${x[0]};render()">${x[1]}</button>`).join('')}</div><div class="c">${rw('Kembalian','<span id="kb">'+rp(Math.max(0,(S.paid||0)-t))+'</span>','font-size:18px')}</div>`:`<div class="c mu">${S.m==='QRIS'?'Tunjukkan kode QR toko ke pelanggan, lalu konfirmasi setelah pembayaran masuk.':'Konfirmasi setelah transfer diterima.'}</div>`)+`<div class="bt"><button class="o" onclick="go('kasir')">Kembali</button><button onclick="selesai()">Selesaikan Transaksi</button></div></div>`};
function selesai(){var t=tot(),p=S.m==='Tunai'?S.paid||0:t;if(p<t)return toast('Uang diterima kurang');var it=C.it.map(x=>{var b=item(x.b);return{nama:b.nama,q:x.q,h:price(b),beli:+b.beli||0}});C.it.forEach(x=>item(x.b).stok-=x.q);db.n++;var x={id:uid(),no:'TRX-'+ymd(Date.now()).replace(/-/g,'')+'-'+DV()+String(db.n).padStart(4,'0'),t:Date.now(),kasir:ME.nama,it,dis:C.dis,pt:ptv(),tot:t,metode:S.m,bayar:p};var mb=C.m&&mem(C.m);if(mb){x.m=mb.id;x.ep=Math.floor(t/1e4);mb.poin+=x.ep-x.pt;mb.tot+=t}db.tx.push(x);save();C={it:[],mode:C.mode,dis:0};S.last=x.id;go('struk')}
VW.struk=()=>{var x=db.tx.find(y=>y.id===S.last);return hd('Transaksi Selesai',x.no)+`<div class="w"><div class="c" id="st"><div style="text-align:center"><b>${esc(db.toko||'Toko')}</b><div class="mu">${new Date(x.t).toLocaleString('id-ID')}</div></div><hr>${x.it.map(i=>rw(esc(i.nama)+' '+i.q+'×',rp(i.h*i.q))).join('')}<hr>${x.dis?rw('Diskon','−'+rp(x.dis)):''}${x.pt?rw('Potongan poin','−'+rp(x.pt*100)):''}${x.ong?rw('Ongkir',rp(x.ong)):''}${rw('Total',rp(x.tot))}${rw(x.metode,rp(x.bayar))}${rw('Kembali',rp(x.bayar-x.tot))}${x.m&&mem(x.m)?rw('Poin '+esc(mem(x.m).nama),'+'+x.ep+(x.pt?' −'+x.pt:'')):''}<div class="mu" style="text-align:center;margin-top:10px">Terima kasih · ${esc(x.kasir)}</div></div><div class="bt"><button class="o" onclick="print()">Cetak</button><button class="o" onclick="wa()">Kirim WhatsApp</button></div><div class="bt"><button onclick="go('kasir')">Transaksi Baru</button></div></div>`};
function wa(){var x=db.tx.find(y=>y.id===S.last);open('https://wa.me/?text='+encodeURIComponent((db.toko||'Toko')+'\n'+x.no+'\n'+x.it.map(i=>i.nama+' '+i.q+'× '+rp(i.h*i.q)).join('\n')+'\nTotal '+rp(x.tot)))}
/* BARANG */
var stat=b=>b.stok<=0?['Habis','er']:b.stok<=(+b.min||0)?['Menipis','wr']:['Aman','ok'],setF=f=>{S.f=f;render()};
function blist(){var q=(S.bq||'').toLowerCase();return db.b.filter(b=>(b.kode+' '+b.nama).toLowerCase().includes(q)&&(S.f!=='m'||stat(b)[1]!=='ok')).map(b=>{var s=stat(b);return`<div class="c" ${canE()?`onclick="go('fb','${b.id}')"`:''}>${rw(esc(b.nama),`<span class="bg ${s[1]}">${s[0]}</span>`)}<div class="mu">${esc(b.kode||'-')} · stok ${b.stok} ${esc(b.sat)} · ${rp(b.eceran)}</div></div>`}).join('')||'<div class="c mu">Belum ada barang.</div>'}
VW.barang=()=>hd('Barang dan Stok',db.b.length+' barang')+`<div class="w"><label>Cari barang</label><input value="${esc(S.bq||'')}" oninput="S.bq=this.value;$('bl').innerHTML=blist()">`+sgm([['a','Semua'],['m','Menipis']],S.f||'a','setF')+`<div id="bl">${blist()}</div></div>`+(canE()?`<button class="fab" aria-label="Tambah barang" onclick="go('fb','new')">+</button>`:'');
VW.fb=()=>{var n=S.p==='new',b=n?{sat:'pcs',stok:0,min:5}:item(S.p),F=(id,l,v,t)=>`<label>${l}</label><input id="f_${id}" type="${t||'text'}" value="${esc(v==null?'':v)}">`;return hd(n?'Barang Baru':'Ubah Barang')+'<div class="w"><div class="c">'+F('kode','Kode / barcode',b.kode)+F('nama','Nama barang',b.nama)+F('sat','Satuan (pcs, dus, kg)',b.sat)+F('beli','Harga beli',b.beli,'number')+F('eceran','Harga eceran',b.eceran,'number')+F('grosir','Harga grosir (opsional)',b.grosir,'number')+F('stok',n?'Stok awal':'Stok fisik (opname)',b.stok,'number')+F('min','Batas stok menipis',b.min,'number')+`</div><div class="bt"><button class="o" onclick="go('barang')">Batal</button><button onclick="saveB()">Simpan</button></div>`+(n?'':`<div class="bt"><button class="d" onclick="delB()">Hapus barang</button></div>`)+'</div>'};
function saveB(){var g=k=>$('f_'+k).value.trim(),n=S.p==='new',b=n?{id:uid()}:item(S.p),kd=g('kode');if(!g('nama'))return toast('Isi nama barang');if(!(+g('eceran')>0))return toast('Isi harga eceran');if(kd&&db.b.some(x=>x.id!==b.id&&x.kode===kd))return toast('Kode sudah dipakai');Object.assign(b,{kode:kd,nama:g('nama'),sat:g('sat')||'pcs',beli:+g('beli')||0,eceran:+g('eceran'),grosir:+g('grosir')||0,stok:+g('stok')||0,min:+g('min')||0});if(n)db.b.push(b);save();toast('Barang tersimpan');go('barang')}
function delB(){if(confirm('Hapus barang ini?')){db.b=db.b.filter(x=>x.id!==S.p);save();go('barang')}}
/* PO */
VW.po=()=>hd('Purchase Order','Pembelian ke supplier')+'<div class="w">'+(db.po.slice().reverse().map(p=>`<div class="c" onclick="${p.st==='Draft'?`editPO('${p.id}')`:`go('tpo','${p.id}')`}">${rw(p.no,`<span class="bg ${{Dikirim:'wr',Sebagian:'wr',Selesai:'ok'}[p.st]||''}">${p.st}</span>`)}<div class="mu">${esc(p.sup)} · ${p.tgl} · ${p.it.length} barang · ${rp(p.it.reduce((s,i)=>s+i.q*i.h,0))}</div></div>`).join('')||'<div class="c mu">Belum ada PO. Ketuk + untuk membuat.</div>')+'</div>'+(canE()?`<button class="fab" aria-label="Buat PO" onclick="newPO()">+</button>`:'');
function newPO(){S.po={id:uid(),no:'PO-'+ymd(Date.now()).replace(/-/g,'')+'-'+String(db.po.length+1).padStart(3,'0'),sup:'',tgl:ymd(Date.now()),st:'Draft',it:[]};go('fpo')}
function editPO(id){S.po=JSON.parse(JSON.stringify(db.po.find(x=>x.id===id)));go('fpo')}
function rdPO(){if($('p_sup')){S.po.sup=$('p_sup').value.trim();S.po.tgl=$('p_tgl').value}}
VW.fpo=()=>{var p=S.po;return hd(p.no,'Status: Draft')+`<div class="w"><div class="c"><label>Supplier</label><input id="p_sup" list="sl" value="${esc(p.sup)}"><datalist id="sl">${[...new Set(db.po.map(x=>x.sup))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist><label>Tanggal PO</label><input id="p_tgl" type="date" value="${p.tgl}"></div>`+p.it.map((i,k)=>`<div class="c">${rw(nm(i.b),rp(i.q*i.h))}<div class="r mu" style="margin-top:6px"><span>${i.q} × ${rp(i.h)}</span><button class="d" onclick="rdPO();S.po.it.splice(${k},1);render()">Hapus</button></div></div>`).join('')+`<div class="c"><b>Tambah barang</b><label>Barang</label><select id="a_b" onchange="$('a_h').value=item(this.value).beli">${db.b.map(b=>`<option value="${b.id}">${esc(b.nama)}</option>`).join('')}</select><label>Jumlah</label><input id="a_q" type="number" value="1"><label>Harga beli per satuan</label><input id="a_h" type="number" value="${db.b[0]?db.b[0].beli:0}"><div class="bt"><button class="o" onclick="addPO()">Tambah ke PO</button></div></div><div class="c">${rw('Total PO',rp(p.it.reduce((s,i)=>s+i.q*i.h,0)),'font-size:16px')}</div><div class="bt"><button class="o" onclick="savePO(0)">Simpan Draft</button><button onclick="savePO(1)">Kirim ke Supplier</button></div></div>`};
function addPO(){rdPO();var b=$('a_b').value,q=+$('a_q').value,h=+$('a_h').value;if(!b)return toast('Isi data barang dulu');if(!(q>0))return toast('Isi jumlah');S.po.it.push({b,q,h:h||0,t:0});render()}
function savePO(k){rdPO();var p=S.po;if(!p.sup)return toast('Isi supplier');if(!p.it.length)return toast('Tambah barang dulu');p.st=k?'Dikirim':'Draft';var i=db.po.findIndex(x=>x.id===p.id);i>-1?db.po[i]=p:db.po.push(p);save();toast(k?'PO dikirim':'Draft tersimpan');go('po')}
VW.tpo=()=>{var p=db.po.find(x=>x.id===S.p),fin=p.st==='Selesai';return hd(p.no,p.sup+' · '+p.st)+'<div class="w">'+p.it.map((i,k)=>`<div class="c">${rw(nm(i.b),rp(i.q*i.h))}<div class="mu">Dipesan ${i.q} · Sudah diterima ${i.t||0}</div>${fin?'':`<label>Diterima sekarang</label><input id="t_${k}" type="number" value="${Math.max(0,i.q-(i.t||0))}">`}</div>`).join('')+`<div class="c">${rw('Total PO',rp(p.it.reduce((s,i)=>s+i.q*i.h,0)))}</div><div class="bt"><button class="o" onclick="go('po')">Kembali</button>${fin||!canE()?'':'<button onclick="terima()">Simpan Penerimaan</button>'}</div></div>`};

(async()=>{db.m=db.m||[];db.o=db.o||[];if(!db.u.length){db.u.push({id:uid(),nama:'Pemilik',un:'pemilik',pw:await hp('pemilik','admin123'),role:'pemilik'});save()}render()})();
</script><script>/* SINKRONISASI (Firestore REST, offline-first) */
(function(){
var CK='pos1cfg',QK='pos1q',SK='pos1sn',COLS=['b','m','o','tx','po','u'],NUM={b:['stok'],m:['poin','tot']},

window.DV=()=>{var d=localStorage.getItem('pos1dev');if(!d){d=Math.random().toString(36).slice(2,4).toUpperCase();localStorage.setItem('pos1dev',d)}return d};
function ui(){var e=document.getElementById('sy');if(e)e.textContent=st+(Q.length?' · '+Q.length+' menunggu kirim':'')}
function diff(){if(!cfg.on)return;var any=0;COLS.forEach(c=>{var s=SN[c]=SN[c]||{},seen={};(db[c]||[]).forEach(r=>{seen[r.id]=1;var x=rec(c,r),p=s[r.id];if(!p||p[0]!==x[0]||JSON.stringify(p[1])!==JSON.stringify(x[1])){var d={};for(var k in x[1])d[k]=x[1][k]-(p?p[1][k]:0);Q.push({c,id:r.id,j:x[0],d});s[r.id]=x;any=1}});Object.keys(s).forEach(id=>{if(!seen[id]){Q.push({c,id,x:1,d:{}});delete s[id];any=1}})});if(any){persist();ui();clearTimeout(diff.h);diff.h=setTimeout(tick,2000)}}
async function fx(u,b){var r=await fetch(api+u,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'Error '+r.status);return j}
async function auth(){if(tok&&Date.now()<exp)return;var r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+cfg.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:cfg.email,password:cfg.pass,returnSecureToken:true})}),j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'Login gagal');tok=j.idToken;exp=Date.now()+(+j.expiresIn-120)*1e3}
async function push(){var m={};Q.forEach(e=>{var k=e.c+'/'+e.id,o=m[k]=m[k]||{c:e.c,id:e.id,d:{},x:0};if(e.x)o.x=1;else{o.x=0;o.j=e.j}for(var f in e.d)o.d[f]=(o.d[f]||0)+e.d[f]});
var ks=Object.keys(m).slice(0,200),W=ks.map(k=>{var o=m[k],f={u:{integerValue:String(Date.now())},x:{booleanValue:!!o.x}},mk=['u','x'];if(o.j){f.j={stringValue:o.j};mk.push('j')}var w={update:{name:base()+'/'+o.c+'/'+o.id,fields:f},updateMask:{fieldPaths:mk}},tr=Object.keys(o.d).filter(f=>o.d[f]).map(f=>({fieldPath:f,increment:nv(o.d[f])}));if(tr.length)w.updateTransforms=tr;return w});
if(!W.length)return;await fx('projects/'+cfg.pid+'/databases/(default)/documents:commit',{writes:W});var sent={};ks.forEach(k=>sent[k]=1);Q=Q.filter(e=>!sent[e.c+'/'+e.id]);persist()}
async function pull(){cfg.last=cfg.last||{};var ch=0;for(var c of COLS){var last=Math.max(0,(cfg.last[c]||0)-60000),R=await fx(base().replace(/\/t\/[^/]+$/,'')+'/t/'+cfg.toko+':runQuery',{structuredQuery:{from:[{collectionId:c}],where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN',value:{integerValue:String(last)}}},orderBy:[{field:{fieldPath:'u'}}]}});
(R||[]).forEach(z=>{var d=z.document;if(!d)return;var id=d.name.split('/').pop(),f=d.fields||{},u=rv(f.u);cfg.last[c]=Math.max(cfg.last[c]||0,u);db[c]=db[c]||[];var s=SN[c]=SN[c]||{},i=db[c].findIndex(x=>x.id===id);

if(!f.j)return;var r=JSON.parse(f.j.stringValue);(NUM[c]||[]).forEach(k=>r[k]=rv(f[k]));var x=rec(c,r);if(s[id]&&s[id][0]===x[0]&&JSON.stringify(s[id][1])===JSON.stringify(x[1]))return;i>-1?db[c][i]=r:db[c].push(r);s[id]=x;ch=1})}
persist();if(ch){_sv();if(['pesanan','barang','laporan','member','po'].includes(V))render()}}
async function tick(){if(!cfg.on||busy)return;busy=1;try{await auth();if(Q.length)await push();if(!Q.length)await pull();st='Tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}catch(e){st='Offline/gagal: '+e.message}busy=0;ui()}
save=function(){_sv();diff()};
window.syConn=async function(mode){var g=i=>$(i).value.trim();cfg={pid:g('sy_p'),key:g('sy_k'),email:g('sy_e'),pass:$('sy_w').value,toko:g('sy_t')||'toko1',on:1,last:{}};if(!cfg.pid||!cfg.key||!cfg.email||!cfg.pass)return toast('Lengkapi semua isian');tok=null;

Q=[];SN={};if(mode==='down'){if(!confirm('Data di HP ini diganti dengan data dari cloud. Lanjut?')){cfg.on=0;return}db={u:[],b:[],po:[],tx:[],m:[],o:[],n:0,toko:db.toko};_sv();ME=null}persist();if(mode==='up')diff();st='Menyambung...';await tick();render();toast(mode==='up'?'Data diunggah':'Data diambil, silakan masuk')};

var _ak=VW.akun;VW.akun=()=>{var h=_ak();if(ME.role!=='pemilik')return h;var k='<div class="bt"><button class="d" onclick="ME=null;render()">',i=h.lastIndexOf(k),v=x=>esc(cfg[x]||''),

window.tick=tick;setInterval(tick,15000);addEventListener('online',tick);setTimeout(tick,3000);
})();
